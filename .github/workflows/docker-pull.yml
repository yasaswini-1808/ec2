name: Deploy Docker Container to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    # GitHub provides this runner
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Check required deployment secrets
      - name: Check Deployment Secrets
        id: check-secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          missing=()
          [ -z "$EC2_HOST" ] && missing+=("EC2_HOST")
          [ -z "$EC2_USER" ] && missing+=("EC2_USER")
          [ -z "$EC2_SSH_KEY" ] && missing+=("EC2_SSH_KEY")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required secrets: ${missing[*]}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Step 2: Configure SSH access to EC2
      - name: Configure SSH
        if: steps.check-secrets.outputs.ready == 'true'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      # Step 3: Connect to EC2 and deploy the container
      - name: Pull and Run Docker Container
        if: steps.check-secrets.outputs.ready == 'true'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" \
            'set -e
             docker pull nginx:alpine
             docker rm -f nginx-demo 2>/dev/null || true
             docker run -d \
               --name nginx-demo \
               --restart unless-stopped \
               -p 8081:80 \
               nginx:alpine
             docker ps'

      - name: Deployment Skipped
        if: steps.check-secrets.outputs.ready != 'true'
        run: echo "Skipping deployment because required EC2 secrets are not configured."
