name: Deploy Docker Container to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    # GitHub provides this runner
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Configure SSH access to EC2
      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      # Step 3: Connect to EC2 and deploy the container
      - name: Pull and Run Docker Container
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" \
            'set -e
             docker pull nginx:alpine
             docker rm -f nginx-demo 2>/dev/null || true
             docker run -d \
               --name nginx-demo \
               --restart unless-stopped \
               -p 8081:80 \
               nginx:alpine
             docker ps'
